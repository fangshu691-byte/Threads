name: daily-post

on:
  schedule:
    # 7:00〜19:00 (JST) の間、毎時実行。GitHub Actionsのcronは分単位まで
    # 保証されない場合があるため、数分の遅延はあり得ます。
    # UTC換算: JST 7:00-19:00 = UTC 22:00-23:00, 0:00-10:00
    - cron: "0 0-10,22-23 * * *"
  workflow_dispatch: {}

# state.json をコミットし直すために書き込み権限が必要
permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 直前のコミットとの競合を避けるため、最新のHEADを取得
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Threads posting (next item in weekly cycle)
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
        run: python blotato_threads_post.py

      - name: Commit updated state.json and post_log.jsonl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 変更が無ければ何もしない(空コミット防止)
          if git diff --quiet -- blotato_post_state.json post_log.jsonl; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          git add blotato_post_state.json post_log.jsonl
          git commit -m "chore: update state and post log [skip ci]"

          # 他のワークフロー実行やmergeとの競合を避けるため、
          # pull --rebase してからpushする
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
