name: threads-post

# 【重要】このリポジトリで唯一の投稿ワークフローです。
# 過去に daily-post.yml / blotato-daily-post.yml が併存して混乱したため、
# 古いワークフローファイルは全て削除し、これ1本に統合しています。
# 新しいワークフローや紛らわしい名前のファイルを追加しないでください。

on:
  schedule:
    # JST 7:07〜19:07 の間、毎時実行(13回/日)。
    # ちょうど「00分」は世界中の大量のワークフローが集中し、
    # GitHub Actions側で混雑・遅延・ドロップされやすいことが知られているため、
    # あえて7分ずらして混雑を避ける。
    # UTC換算: 22:07-23:07, 0:07-10:07
    - cron: "7 0-10,22-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # トリガー種別をログの最初に出す。
      # "schedule" と出ていれば自動cronが本当に発火した証拠。
      # "workflow_dispatch" は手動実行。この違いを毎回ここで確認できるようにする。
      - name: Show trigger type
        run: echo "GITHUB_EVENT_NAME=${{ github.event_name }}"

      - name: Run Threads posting
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
        run: python threads_post.py

      - name: Commit updated state.json and post_log.jsonl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git diff は untracked(新規)ファイルを無視してしまうため、
          # git status --porcelain で新規・変更どちらも検出する
          if [ -z "$(git status --porcelain -- blotato_post_state.json post_log.jsonl)" ]; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          git add blotato_post_state.json post_log.jsonl
          git commit -m "chore: update state and post log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Verify state.json actually reached remote
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          LOCAL_CURSOR=$(python3 -c "import json; print(json.load(open('blotato_post_state.json'))['cursor'])")
          if ! git show "origin/${GITHUB_REF_NAME}:blotato_post_state.json" > /tmp/remote_state.json 2>/dev/null; then
            echo "::error::blotato_post_state.jsonがリモートに一度も存在しません。直前のコミット/pushが失敗しています。"
            exit 1
          fi
          REMOTE_CURSOR=$(python3 -c "import json; print(json.load(open('/tmp/remote_state.json'))['cursor'])")
          echo "ローカルのcursor: ${LOCAL_CURSOR} / リモートのcursor: ${REMOTE_CURSOR}"
          if [ "$LOCAL_CURSOR" != "$REMOTE_CURSOR" ]; then
            echo "::error::state.jsonのpushがリモートに反映されていません(ローカル=${LOCAL_CURSOR}, リモート=${REMOTE_CURSOR})。次回も同じ投稿が繰り返される原因になります。"
            exit 1
          fi
